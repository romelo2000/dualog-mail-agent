# Правила определения "важности" письма.
# Совпадение по ЛЮБОМУ пункту в любом списке = письмо считается важным.
# Все сравнения регистронезависимы, подстрокой.

senders:
  # адреса или домены отправителей, которые всегда важны
  - "captain@"
  - "@dnv.com"
  - "port-authority"

subject_keywords:
  - "urgent"
  - "срочно"
  - "avarii"
  - "авария"
  - "detention"
  - "psc"
  - "survey"
  - "invoice"
  - "инвойс"

body_keywords:
  - "requires immediate"
  - "требуется немедленно"
  - "deadline"

# Отправители, которые ИСКЛЮЧАЮТСЯ даже если попали под другое правило
# (например, автоматические рассылки/ньюслеттеры)
exclude_senders:
  - "noreply@"
  - "newsletter@"
